<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Digit PIN Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 280px;
    }
    .pin-display {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 0.5rem;
      margin: 1.5rem 0;
      color: #2c3e50;
      min-height: 4rem;
    }
    button {
      background-color: #ffca28;
      color: #2c3e50;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #ffb300; }
  </style>
</head>
<body>

  <div class="card">
    <h2>PIN Generator</h2>
    <div class="pin-display" id="pinDisplay">----</div>
    <button id="generateBtn">Generate 4-Digit PIN</button>
  </div>

  <script>
    // 1. Register Service Worker on page initialization
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => console.log('Service Worker Active on scope:', reg.scope))
          .catch(err => console.error('Registration failed:', err.message));
      });
    }

    // 2. Button Event Listener
    const button = document.getElementById('generateBtn');
    const display = document.getElementById('pinDisplay');

    button.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) throw new Error('Network response was not OK');

        const data = await response.json();
        display.textContent = data.pin;
      } catch (err) {
        console.error('Error:', err);
        display.textContent = 'ERR';
      }
    });
  </script>
</body>
</html>
